<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Space X</title>
<style>
:root{--bg:#03050d;--ink:#e8f1ff;--cyan:#4de1ff;--amber:#ffb347;--red:#ff4d5e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;touch-action:none}
#game,#game canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));display:none;align-items:center;gap:18px;font-size:20px;font-weight:700;text-shadow:0 0 8px #000}
#hud .hearts{color:var(--red);letter-spacing:4px}
#hud .dim{opacity:.35}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(3,5,13,.55)}
.screen.on{display:flex}
h1{font-size:clamp(40px,10vw,84px);letter-spacing:.12em;color:var(--cyan);text-shadow:0 0 24px rgba(77,225,255,.55)}
.play{width:104px;height:104px;border-radius:50%;border:3px solid var(--cyan);background:rgba(77,225,255,.12);color:var(--cyan);font-size:48px;padding-left:8px;cursor:pointer}
.play:active{background:rgba(77,225,255,.35)}
.btn{padding:12px 26px;border-radius:10px;border:2px solid var(--cyan);background:transparent;color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.btn.main{background:var(--cyan);color:#03121a}
.row{display:flex;gap:14px}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 28px;font-size:20px}
.stats b{text-align:right;color:var(--amber)}
#count{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:clamp(90px,24vw,200px);font-weight:900;color:var(--amber);text-shadow:0 0 30px rgba(255,179,71,.6);pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><span id="score">0</span><span id="time">00:00</span><span class="hearts" id="hearts"></span></div>
<div id="count"></div>
<div class="screen on" id="menu"><h1>SPACE X</h1><button class="play" id="playBtn" aria-label="Main">&gt;</button></div>
<div class="screen" id="over">
  <h1 id="overTitle" style="font-size:clamp(32px,7vw,56px)"></h1>
  <div class="stats" id="stats"></div>
  <div class="row"><button class="btn main" id="againBtn"></button><button class="btn" id="menuBtn"></button></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
